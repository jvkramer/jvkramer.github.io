<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overhead Plane Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        h1 {
            margin: 0 0 15px 0;
            color: #00d4ff;
            font-size: 1.4em;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .controls {
            background: #16213e;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        label {
            font-size: 0.7em;
            color: #aaa;
        }
        input[type="number"], input[type="text"] {
            padding: 5px 8px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #0f0f23;
            color: #fff;
            font-size: 0.85em;
            width: 100px;
        }
        input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00d4ff;
            color: #000;
        }
        .btn-primary:hover {
            background: #00a8cc;
        }
        .btn-secondary {
            background: #333;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #444;
        }
        .btn-danger {
            background: #ff4757;
            color: #fff;
        }
        .btn-danger:hover {
            background: #ff3344;
        }
        #map {
            height: 350px;
            border-radius: 8px;
        }
        .status {
            background: #16213e;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8em;
        }
        .status-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.active {
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .planes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .plane-card {
            background: #16213e;
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid #00d4ff;
        }
        .plane-card.closest {
            border-left-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }
        .plane-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .callsign {
            font-size: 1.1em;
            font-weight: bold;
            color: #00d4ff;
            font-family: monospace;
        }
        .route {
            font-size: 0.95em;
            color: #fff;
            margin-top: 2px;
        }
        .route-arrow {
            color: #00d4ff;
            margin: 0 4px;
        }
        .distance {
            background: #0f0f23;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75em;
        }
        .no-planes {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 0.95em;
        }
        .error {
            background: #ff475720;
            border: 1px solid #ff4757;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.8em;
        }
        .closest-label {
            background: #00ff88;
            color: #000;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.6em;
            font-weight: bold;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 0.7em;
        }
        footer a {
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Overhead Plane Tracker</h1>

        <div class="controls">
            <div class="control-group">
                <label for="latitude">Latitude</label>
                <input type="number" id="latitude" step="0.0001" placeholder="55.6761">
            </div>
            <div class="control-group">
                <label for="longitude">Longitude</label>
                <input type="number" id="longitude" step="0.0001" placeholder="12.5683">
            </div>
            <div class="control-group">
                <label for="radius">Radius (km)</label>
                <input type="number" id="radius" value="10" min="1" max="100">
            </div>
            <div class="control-group">
                <label for="interval">Update interval (sec)</label>
                <input type="number" id="interval" value="10" min="5" max="120">
            </div>
            <button class="btn-secondary" onclick="useMyLocation()">Use My Location</button>
            <button class="btn-primary" id="startBtn" onclick="startTracking()">Start Tracking</button>
            <button class="btn-danger" id="stopBtn" onclick="stopTracking()" style="display:none;">Stop</button>
        </div>

        <div id="error" class="error" style="display:none;"></div>

        <div class="status">
            <div class="status-text">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Not tracking</span>
            </div>
            <div id="lastUpdate"></div>
        </div>

        <div id="planesContainer" class="planes-container">
            <div class="no-planes">Enter your coordinates and click "Start Tracking" to find planes overhead.</div>
        </div>

        <div id="map"></div>

        <footer>
            Data from <a href="https://opensky-network.org" target="_blank">OpenSky Network</a> |
            Updates may be delayed up to 15 seconds
        </footer>
    </div>

    <script>
        let map;
        let trackingInterval = null;
        let markers = [];
        let myLocationMarker = null;
        let searchCircle = null;
        const routeCache = new Map(); // Cache routes to avoid repeated API calls

        // Airport database with city names and coordinates (ICAO codes)
        const airports = {
            // Major European airports
            'EKCH': { city: 'Copenhagen', code: 'CPH', lat: 55.618, lon: 12.656 },
            'EGLL': { city: 'London', code: 'LHR', lat: 51.470, lon: -0.454 },
            'EGKK': { city: 'London', code: 'LGW', lat: 51.148, lon: -0.190 },
            'EGLC': { city: 'London', code: 'LCY', lat: 51.505, lon: 0.055 },
            'EGSS': { city: 'London', code: 'STN', lat: 51.885, lon: 0.235 },
            'LFPG': { city: 'Paris', code: 'CDG', lat: 49.010, lon: 2.548 },
            'LFPO': { city: 'Paris', code: 'ORY', lat: 48.723, lon: 2.379 },
            'EHAM': { city: 'Amsterdam', code: 'AMS', lat: 52.309, lon: 4.764 },
            'EDDF': { city: 'Frankfurt', code: 'FRA', lat: 50.033, lon: 8.571 },
            'EDDM': { city: 'Munich', code: 'MUC', lat: 48.354, lon: 11.786 },
            'EDDB': { city: 'Berlin', code: 'BER', lat: 52.362, lon: 13.509 },
            'LEMD': { city: 'Madrid', code: 'MAD', lat: 40.472, lon: -3.561 },
            'LEBL': { city: 'Barcelona', code: 'BCN', lat: 41.297, lon: 2.078 },
            'LIRF': { city: 'Rome', code: 'FCO', lat: 41.800, lon: 12.239 },
            'LIMC': { city: 'Milan', code: 'MXP', lat: 45.630, lon: 8.723 },
            'LSZH': { city: 'Zurich', code: 'ZRH', lat: 47.458, lon: 8.548 },
            'LOWW': { city: 'Vienna', code: 'VIE', lat: 48.110, lon: 16.570 },
            'ENGM': { city: 'Oslo', code: 'OSL', lat: 60.194, lon: 11.100 },
            'ESSA': { city: 'Stockholm', code: 'ARN', lat: 59.652, lon: 17.919 },
            'EFHK': { city: 'Helsinki', code: 'HEL', lat: 60.317, lon: 24.963 },
            'EPWA': { city: 'Warsaw', code: 'WAW', lat: 52.166, lon: 20.967 },
            'LKPR': { city: 'Prague', code: 'PRG', lat: 50.101, lon: 14.260 },
            'LHBP': { city: 'Budapest', code: 'BUD', lat: 47.437, lon: 19.261 },
            'EIDW': { city: 'Dublin', code: 'DUB', lat: 53.421, lon: -6.270 },
            'EBBR': { city: 'Brussels', code: 'BRU', lat: 50.901, lon: 4.484 },
            'LPPT': { city: 'Lisbon', code: 'LIS', lat: 38.774, lon: -9.134 },
            'LGAV': { city: 'Athens', code: 'ATH', lat: 37.936, lon: 23.947 },
            'LTFM': { city: 'Istanbul', code: 'IST', lat: 41.262, lon: 28.742 },
            'UUEE': { city: 'Moscow', code: 'SVO', lat: 55.973, lon: 37.415 },
            // Major US airports
            'KJFK': { city: 'New York', code: 'JFK', lat: 40.640, lon: -73.779 },
            'KLAX': { city: 'Los Angeles', code: 'LAX', lat: 33.943, lon: -118.408 },
            'KORD': { city: 'Chicago', code: 'ORD', lat: 41.978, lon: -87.904 },
            'KATL': { city: 'Atlanta', code: 'ATL', lat: 33.637, lon: -84.428 },
            'KDFW': { city: 'Dallas', code: 'DFW', lat: 32.897, lon: -97.038 },
            'KDEN': { city: 'Denver', code: 'DEN', lat: 39.862, lon: -104.673 },
            'KSFO': { city: 'San Francisco', code: 'SFO', lat: 37.619, lon: -122.375 },
            'KMIA': { city: 'Miami', code: 'MIA', lat: 25.795, lon: -80.287 },
            'KEWR': { city: 'Newark', code: 'EWR', lat: 40.693, lon: -74.169 },
            'KBOS': { city: 'Boston', code: 'BOS', lat: 42.365, lon: -71.010 },
            // Asia/Middle East
            'VHHH': { city: 'Hong Kong', code: 'HKG', lat: 22.309, lon: 113.915 },
            'RJTT': { city: 'Tokyo', code: 'HND', lat: 35.553, lon: 139.781 },
            'RJAA': { city: 'Tokyo', code: 'NRT', lat: 35.765, lon: 140.386 },
            'RKSI': { city: 'Seoul', code: 'ICN', lat: 37.463, lon: 126.440 },
            'WSSS': { city: 'Singapore', code: 'SIN', lat: 1.350, lon: 103.994 },
            'OMDB': { city: 'Dubai', code: 'DXB', lat: 25.253, lon: 55.364 },
            'OERK': { city: 'Riyadh', code: 'RUH', lat: 24.958, lon: 46.699 },
            'VIDP': { city: 'Delhi', code: 'DEL', lat: 28.556, lon: 77.100 },
            'VABB': { city: 'Mumbai', code: 'BOM', lat: 19.089, lon: 72.868 },
            'ZBAA': { city: 'Beijing', code: 'PEK', lat: 40.080, lon: 116.585 },
            'ZSPD': { city: 'Shanghai', code: 'PVG', lat: 31.143, lon: 121.805 },
            'VTBS': { city: 'Bangkok', code: 'BKK', lat: 13.681, lon: 100.747 },
            // Other
            'YSSY': { city: 'Sydney', code: 'SYD', lat: -33.946, lon: 151.177 },
            'YMML': { city: 'Melbourne', code: 'MEL', lat: -37.673, lon: 144.843 },
            'NZAA': { city: 'Auckland', code: 'AKL', lat: -37.008, lon: 174.792 },
            'FAOR': { city: 'Johannesburg', code: 'JNB', lat: -26.139, lon: 28.246 },
            'SBGR': { city: 'São Paulo', code: 'GRU', lat: -23.432, lon: -46.470 },
            'MMMX': { city: 'Mexico City', code: 'MEX', lat: 19.436, lon: -99.072 },
            'CYYZ': { city: 'Toronto', code: 'YYZ', lat: 43.677, lon: -79.631 },
            'CYVR': { city: 'Vancouver', code: 'YVR', lat: 49.195, lon: -123.179 },
        };

        // Get airport info from ICAO code
        function getAirportInfo(icao) {
            return airports[icao] || null;
        }

        // Format ETA as hours and minutes
        function formatETA(minutes) {
            if (minutes < 1) return '< 1 min';
            if (minutes < 60) return `${Math.round(minutes)} min`;
            const hours = Math.floor(minutes / 60);
            const mins = Math.round(minutes % 60);
            return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
        }

        // Initialize map
        function initMap() {
            map = L.map('map').setView([55.6761, 12.5683], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap, &copy; CARTO'
            }).addTo(map);
        }

        // Calculate distance between two coordinates (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Use browser geolocation
        function useMyLocation() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('latitude').value = position.coords.latitude.toFixed(4);
                    document.getElementById('longitude').value = position.coords.longitude.toFixed(4);
                    updateMapCenter();
                },
                (error) => {
                    showError('Unable to get your location: ' + error.message);
                }
            );
        }

        // Update map center and marker
        function updateMapCenter() {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lon = parseFloat(document.getElementById('longitude').value);
            const radius = parseFloat(document.getElementById('radius').value);

            if (isNaN(lat) || isNaN(lon)) return;

            map.setView([lat, lon], 11);

            // Update location marker
            if (myLocationMarker) {
                myLocationMarker.setLatLng([lat, lon]);
            } else {
                myLocationMarker = L.circleMarker([lat, lon], {
                    radius: 8,
                    fillColor: '#00ff88',
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 1
                }).addTo(map).bindPopup('Your Location');
            }

            // Update search radius circle
            if (searchCircle) {
                searchCircle.setLatLng([lat, lon]);
                searchCircle.setRadius(radius * 1000);
            } else {
                searchCircle = L.circle([lat, lon], {
                    radius: radius * 1000,
                    color: '#00d4ff',
                    fillColor: '#00d4ff',
                    fillOpacity: 0.1,
                    weight: 1
                }).addTo(map);
            }
        }

        // Create plane icon
        function createPlaneIcon(heading) {
            return L.divIcon({
                className: 'plane-icon',
                html: `<div style="transform: rotate(${heading || 0}deg); font-size: 24px; color: #00d4ff;">✈</div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }

        // Fetch planes from OpenSky Network
        async function fetchPlanes() {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lon = parseFloat(document.getElementById('longitude').value);
            const radius = parseFloat(document.getElementById('radius').value);

            if (isNaN(lat) || isNaN(lon)) {
                showError('Please enter valid coordinates');
                return;
            }

            // Calculate bounding box (approximate)
            const latDelta = radius / 111; // 1 degree latitude ≈ 111 km
            const lonDelta = radius / (111 * Math.cos(lat * Math.PI / 180));

            const lamin = lat - latDelta;
            const lamax = lat + latDelta;
            const lomin = lon - lonDelta;
            const lomax = lon + lonDelta;

            const url = `https://opensky-network.org/api/states/all?lamin=${lamin}&lomin=${lomin}&lamax=${lamax}&lomax=${lomax}`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    if (response.status === 429) {
                        showError('Rate limited by OpenSky API. Try increasing the update interval.');
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                hideError();
                processPlanes(data, lat, lon, radius);
            } catch (error) {
                showError(`Failed to fetch data: ${error.message}. This may be due to CORS restrictions - try using a browser extension or running locally.`);
            }
        }

        // Fetch route info for a callsign
        async function fetchRoute(callsign) {
            if (!callsign || callsign === 'Unknown') return null;
            if (routeCache.has(callsign)) return routeCache.get(callsign);

            try {
                const response = await fetch(`https://opensky-network.org/api/routes?callsign=${callsign}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.route && data.route.length >= 2) {
                        const originIcao = data.route[0];
                        const destIcao = data.route[data.route.length - 1];
                        const originInfo = getAirportInfo(originIcao);
                        const destInfo = getAirportInfo(destIcao);
                        const route = {
                            origin: originIcao,
                            destination: destIcao,
                            originCity: originInfo?.city || originIcao,
                            originCode: originInfo?.code || originIcao,
                            destCity: destInfo?.city || destIcao,
                            destCode: destInfo?.code || destIcao,
                            destLat: destInfo?.lat,
                            destLon: destInfo?.lon
                        };
                        routeCache.set(callsign, route);
                        return route;
                    }
                }
            } catch (e) {
                // Route lookup failed, not critical
            }
            routeCache.set(callsign, null);
            return null;
        }

        // Process and display planes
        async function processPlanes(data, userLat, userLon, radius) {
            // Clear old markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            if (!data.states || data.states.length === 0) {
                document.getElementById('planesContainer').innerHTML =
                    '<div class="no-planes">No planes detected in your area right now.</div>';
                updateStatus(0);
                return;
            }

            // Parse planes and calculate distances
            // OpenSky API response format:
            // 0: icao24, 1: callsign, 2: origin_country, 3: time_position,
            // 4: last_contact, 5: longitude, 6: latitude, 7: baro_altitude,
            // 8: on_ground, 9: velocity, 10: true_track, 11: vertical_rate,
            // 12: sensors, 13: geo_altitude, 14: squawk, 15: spi, 16: position_source

            let planes = data.states
                .filter(s => s[5] !== null && s[6] !== null && !s[8]) // Has position and not on ground
                .map(s => {
                    const planeLat = s[6];
                    const planeLon = s[5];
                    const distance = calculateDistance(userLat, userLon, planeLat, planeLon);

                    return {
                        icao24: s[0],
                        callsign: (s[1] || '').trim() || 'Unknown',
                        country: s[2],
                        latitude: planeLat,
                        longitude: planeLon,
                        altitude: s[7] || s[13], // baro or geo altitude
                        velocity: s[9],
                        heading: s[10],
                        verticalRate: s[11],
                        squawk: s[14],
                        distance: distance
                    };
                })
                .filter(p => p.distance <= radius)
                .sort((a, b) => a.distance - b.distance);

            updateStatus(planes.length);

            if (planes.length === 0) {
                document.getElementById('planesContainer').innerHTML =
                    '<div class="no-planes">No planes detected within your radius.</div>';
                return;
            }

            // Fetch routes for all planes in parallel
            const routePromises = planes.map(p => fetchRoute(p.callsign));
            const routes = await Promise.all(routePromises);
            planes.forEach((plane, i) => {
                plane.route = routes[i];
                // Calculate ETA if we have destination coordinates and velocity
                if (plane.route?.destLat && plane.route?.destLon && plane.velocity > 0) {
                    const distToDest = calculateDistance(plane.latitude, plane.longitude, plane.route.destLat, plane.route.destLon);
                    plane.etaMinutes = (distToDest / (plane.velocity * 3.6)) * 60; // velocity is m/s, convert to km/h
                }
            });

            // Add markers to map
            planes.forEach((plane, index) => {
                const marker = L.marker([plane.latitude, plane.longitude], {
                    icon: createPlaneIcon(plane.heading)
                }).addTo(map);

                const routeStr = plane.route ? `${plane.route.originCity} → ${plane.route.destCity}` : '';
                marker.bindPopup(`
                    <strong>${plane.callsign}</strong>${routeStr ? '<br>' + routeStr : ''}<br>
                    ${plane.etaMinutes ? 'ETA: ' + formatETA(plane.etaMinutes) + '<br>' : ''}
                    Distance: ${plane.distance.toFixed(1)} km
                `);

                markers.push(marker);
            });

            // Render plane cards
            const container = document.getElementById('planesContainer');
            container.innerHTML = planes.map((plane, index) => `
                <div class="plane-card ${index === 0 ? 'closest' : ''}">
                    <div class="plane-header">
                        <div>
                            <div class="callsign">${plane.callsign}</div>
                            ${plane.route ? `<div class="route">${plane.route.destCity} <span style="color: #888; font-size: 0.85em;">(${plane.route.destCode})</span></div>` : `<div style="color: #666; font-size: 0.75em;">${plane.country}</div>`}
                        </div>
                        <div style="text-align: right;">
                            ${index === 0 ? '<span class="closest-label">CLOSEST</span><br>' : ''}
                            <span class="distance">${plane.distance.toFixed(1)} km</span>
                        </div>
                    </div>
                    ${plane.route || plane.etaMinutes ? `
                    <div style="display: flex; gap: 15px; margin-top: 6px; font-size: 0.8em;">
                        ${plane.route ? `<div><span style="color: #888;">From:</span> ${plane.route.originCity} <span style="color: #666;">(${plane.route.originCode})</span></div>` : ''}
                        ${plane.etaMinutes ? `<div><span style="color: #888;">ETA:</span> <span style="color: #00ff88;">${formatETA(plane.etaMinutes)}</span></div>` : ''}
                    </div>
                    ` : ''}
                    <div style="margin-top: 8px; font-size: 0.7em;">
                        <a href="https://www.flightradar24.com/${plane.callsign}" target="_blank"
                           style="color: #00d4ff;">FlightRadar24 →</a>
                    </div>
                </div>
            `).join('');

            document.getElementById('lastUpdate').textContent = 'Last update: ' + new Date().toLocaleTimeString();
        }

        // Update status display
        function updateStatus(count) {
            document.getElementById('statusText').textContent =
                `Tracking: ${count} plane${count !== 1 ? 's' : ''} in range`;
        }

        // Start tracking
        function startTracking() {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lon = parseFloat(document.getElementById('longitude').value);

            if (isNaN(lat) || isNaN(lon)) {
                showError('Please enter valid coordinates or use "Use My Location"');
                return;
            }

            updateMapCenter();

            const interval = parseInt(document.getElementById('interval').value) * 1000;

            document.getElementById('statusDot').classList.add('active');
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';

            fetchPlanes(); // Fetch immediately
            trackingInterval = setInterval(fetchPlanes, interval);
        }

        // Stop tracking
        function stopTracking() {
            if (trackingInterval) {
                clearInterval(trackingInterval);
                trackingInterval = null;
            }

            document.getElementById('statusDot').classList.remove('active');
            document.getElementById('statusText').textContent = 'Tracking stopped';
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        // Hide error message
        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        // Initialize
        initMap();

        // Update map when inputs change
        document.getElementById('latitude').addEventListener('change', updateMapCenter);
        document.getElementById('longitude').addEventListener('change', updateMapCenter);
        document.getElementById('radius').addEventListener('change', updateMapCenter);
    </script>
</body>
</html>
